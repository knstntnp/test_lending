<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розыгрыш Mercedes-Benz - Определение победителя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2d2d2d 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 60px 0 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 50px;
        }

        .logo-section {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8em;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.1em;
            color: #888888;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .car-showcase {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
            padding: 0 20px;
        }

        .car-image {
            position: relative;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .car-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .car-image:hover img {
            transform: scale(1.05);
        }

        .car-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 20px;
        }

        .car-title {
            font-size: 1.2em;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .winner-section {
            background: linear-gradient(145deg, #1a1a1a, #252525);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 50px 40px;
            text-align: center;
            margin-bottom: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .winner-title {
            font-size: 1.4em;
            font-weight: 300;
            color: #888888;
            margin-bottom: 25px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .winner-display {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 35px;
        }

        .winner-name {
            font-size: 3em;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 3px;
            animation: none;
        }

        .winner-name.animating {
            animation: pulse 0.1s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .draw-button {
            background: linear-gradient(145deg, #8B0000, #660000);
            color: #ffffff;
            border: none;
            padding: 14px 45px;
            font-size: 0.95em;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.3);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        .draw-button:hover {
            background: linear-gradient(145deg, #A00000, #770000);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 0, 0, 0.5);
        }

        .draw-button:active {
            transform: translateY(0);
        }

        .draw-button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .participants-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 40px;
            margin-top: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .participants-title {
            font-size: 1.5em;
            font-weight: 300;
            color: #888888;
            text-align: center;
            margin-bottom: 35px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .participants-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        .participants-table th {
            background: rgba(255, 255, 255, 0.05);
            color: #888888;
            padding: 18px 15px;
            text-align: left;
            font-weight: 400;
            font-size: 0.85em;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .participants-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 300;
        }

        .participants-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .participants-table tr:last-child td {
            border-bottom: none;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #C0C0C0;
            animation: fall linear forwards;
            z-index: 1000;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        footer {
            text-align: center;
            padding: 40px;
            margin-top: 60px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #666666;
            font-weight: 300;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
                letter-spacing: 4px;
            }

            .winner-name {
                font-size: 1.8em;
            }

            .draw-button {
                padding: 12px 35px;
                font-size: 0.85em;
            }

            .car-showcase {
                grid-template-columns: 1fr;
            }

            .participants-table {
                font-size: 0.85em;
            }

            .participants-table th,
            .participants-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <h1>Mercedes-Benz</h1>
                <p class="subtitle">РОЗЫГРЫШ АВТОМОБИЛЯ ПРЕМИУМ-КЛАССА</p>
            </div>
        </header>

        <section class="car-showcase">
            <div class="car-image">
                <img src="https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=600&h=400&fit=crop" alt="Mercedes-Benz S-Class">
                <div class="car-overlay">
                    <div class="car-title">S-Class</div>
                </div>
            </div>
            <div class="car-image">
                <img src="https://images.unsplash.com/photo-1616422285623-13ff0162193c?w=600&h=400&fit=crop" alt="Mercedes-Benz E-Class">
                <div class="car-overlay">
                    <div class="car-title">E-Class</div>
                </div>
            </div>
            <div class="car-image">
                <img src="https://images.unsplash.com/photo-1553440630-ae80e1fb3f6e?w=600&h=400&fit=crop" alt="Mercedes-Benz GLE">
                <div class="car-overlay">
                    <div class="car-title">GLE Coupe</div>
                </div>
            </div>
        </section>

        <section class="winner-section">
            <h2 class="winner-title">Победитель розыгрыша</h2>
            <div class="winner-display">
                <div class="winner-name" id="winnerName">Нажмите кнопку для определения победителя</div>
            </div>
            <button class="draw-button" id="drawButton" onclick="drawWinner()">Определить Победителя</button>
        </section>

        <section class="participants-section">
            <h2 class="participants-title">Список Участников</h2>
            <table class="participants-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Имя</th>
                        <th>Фамилия</th>
                    </tr>
                </thead>
                <tbody id="participantsTableBody">
                </tbody>
            </table>
        </section>

        <footer>
            <p>© 2024 Mercedes-Benz. Все права защищены.</p>
            <p>Официальный дилер. Розыгрыш проведен честно и прозрачно</p>
        </footer>
    </div>

    <script>
        let participants = [];
        let isAnimating = false;

        const csvData = `Имя,Фамилия,Отчество,Телефон
Александр,Иванов,Сергеевич,+7 (901) 234-56-78
Мария,Петрова,Алексеевна,+7 (902) 345-67-89
Дмитрий,Сидоров,Михайлович,+7 (903) 456-78-90
Елена,Козлова,Дмитриевна,+7 (904) 567-89-01
Андрей,Новиков,Андреевич,+7 (905) 678-90-12
Ольга,Морозова,Владимировна,+7 (906) 789-01-23
Сергей,Волков,Николаевич,+7 (907) 890-12-34
Наталья,Лебедева,Евгеньевна,+7 (908) 901-23-45
Максим,Соколов,Александрович,+7 (909) 012-34-56
Анна,Михайлова,Игоревна,+7 (910) 123-45-67
Иван,Кузнецов,Петрович,+7 (911) 234-56-78
Татьяна,Попова,Сергеевна,+7 (912) 345-67-89
Алексей,Васильев,Алексеевич,+7 (913) 456-78-90
Екатерина,Смирнова,Дмитриевна,+7 (914) 567-89-01
Павел,Федоров,Михайлович,+7 (915) 678-90-12
Юлия,Титова,Андреевна,+7 (916) 789-01-23
Николай,Борисов,Владимирович,+7 (917) 890-12-34
Светлана,Григорьева,Евгеньевна,+7 (918) 901-23-45
Владимир,Орлов,Александрович,+7 (919) 012-34-56
Марина,Зайцева,Игоревна,+7 (920) 123-45-67
Роман,Павлов,Петрович,+7 (921) 234-56-78
Ксения,Соловьева,Сергеевна,+7 (922) 345-67-89
Михаил,Виноградов,Алексеевич,+7 (923) 456-78-90
Виктория,Богданова,Дмитриевна,+7 (924) 567-89-01
Артем,Чернов,Михайлович,+7 (925) 678-90-12
Дарья,Фролова,Андреевна,+7 (926) 789-01-23
Кирилл,Жуков,Владимирович,+7 (927) 890-12-34
Алина,Крылова,Евгеньевна,+7 (928) 901-23-45
Егор,Медведев,Александрович,+7 (929) 012-34-56
Полина,Карпова,Игоревна,+7 (930) 123-45-67`;

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',');
            const result = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j].trim()] = values[j] ? values[j].trim() : '';
                }
                result.push(obj);
            }
            return result;
        }

        function initParticipants() {
            participants = parseCSV(csvData);
            renderParticipantsTable();
        }

        function renderParticipantsTable() {
            const tbody = document.getElementById('participantsTableBody');
            tbody.innerHTML = '';

            participants.forEach((participant, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${participant['Имя']}</td>
                    <td>${participant['Фамилия']}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function createConfetti() {
            const colors = ['#d4af37', '#ffd700', '#ffffff', '#c0c0c0', '#ff6b6b'];
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 20);
            }
        }

        function drawWinner() {
            if (isAnimating) return;

            const button = document.getElementById('drawButton');
            const winnerNameElement = document.getElementById('winnerName');
            
            isAnimating = true;
            button.disabled = true;
            button.textContent = 'Выбираем...';

            let iterations = 0;
            const maxIterations = 30;
            const speed = 80;

            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * participants.length);
                const participant = participants[randomIndex];
                winnerNameElement.textContent = `${participant['Имя']} ${participant['Фамилия']}`;
                winnerNameElement.classList.add('animating');
                
                iterations++;

                if (iterations >= maxIterations) {
                    clearInterval(interval);
                    
                    const finalIndex = Math.floor(Math.random() * participants.length);
                    const winner = participants[finalIndex];
                    winnerNameElement.textContent = `${winner['Имя']} ${winner['Фамилия']}`;
                    winnerNameElement.classList.remove('animating');
                    
                    setTimeout(() => {
                        createConfetti();
                        button.textContent = 'Победитель определен!';
                    }, 500);

                    isAnimating = false;
                }
            }, speed);
        }

        document.addEventListener('DOMContentLoaded', initParticipants);
    </script>
</body>
</html>
